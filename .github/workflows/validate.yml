name: Validate research website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/install-physics.mjs
      - run: npm test
      - run: node tests/viewer-harness.cjs
      - run: node tests/comparison-viewer-harness.cjs
      - run: node tests/validate-benchmarks.cjs
      - run: node tests/structure-viewer-harness.cjs
      - run: node tests/lab-viewer-harness.cjs
      - run: node tests/ros2-viewer-harness.cjs
      - run: node tests/tiago-viewer-harness.mjs
      - run: node tests/validate-tiago-benchmarks.cjs
      - run: node tests/validate-structure-benchmarks.cjs
      - run: npm run build
      - run: node tests/validate-build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-static-site
          path: dist
          retention-days: 14
